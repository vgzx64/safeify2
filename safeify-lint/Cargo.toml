[package]
name = "safeify-lint"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "safeify-lint"
path = "src/main.rs"

# rust-analyzer as a library, built from the vendored source tree
# (vendors/rust-analyzer, commit in its .git file). Path dependencies are used
# instead of the published ra_ap_* crates so the analysis engine is pinned to
# code that is checked into this repository and reproducible offline.
# The `ide` facade crate is deliberately not a dependency: the lints need hir
# (resolution, types) and ide-db (RootDatabase), not assists/completion.
[dependencies]
load-cargo = { path = "../vendors/rust-analyzer/crates/load-cargo" }
ide-db = { path = "../vendors/rust-analyzer/crates/ide-db" }
hir = { path = "../vendors/rust-analyzer/crates/hir" }
base-db = { path = "../vendors/rust-analyzer/crates/base-db" }
syntax = { path = "../vendors/rust-analyzer/crates/syntax" }
project-model = { path = "../vendors/rust-analyzer/crates/project-model" }
vfs = { path = "../vendors/rust-analyzer/crates/vfs" }
paths = { path = "../vendors/rust-analyzer/crates/paths" }
cfg = { path = "../vendors/rust-analyzer/crates/cfg" }
intern = { path = "../vendors/rust-analyzer/crates/intern" }
either = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
