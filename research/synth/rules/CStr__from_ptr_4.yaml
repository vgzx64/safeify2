# CStr::from_ptr — pattern 4: the C string is created in this frame, used by another function.
api: "CStr::from_ptr"
pattern_id: 4
replaceability: Y
verdict: replaceable
difficulty: medium
contract: "The CString is created in this frame and only lent out as a raw pointer; the safe version keeps ownership and passes &CStr across the call boundary (KB: CStr::from_ptr p4 -> Y)."
grid:
  N: [relay, pass, handoff]
unsafe: |
  fn use_$N(p: *const std::os::raw::c_char) {
      let cs = unsafe { std::ffi::CStr::from_ptr(p) };
      let _ = cs.to_bytes().len();
  }
  fn make_$N() {
      let c = std::ffi::CString::new("synth").unwrap();
      use_$N(c.as_ptr());
  }
safe: |
  fn use_$N(cs: &std::ffi::CStr) {
      let _ = cs.to_bytes().len();
  }
  fn make_$N() {
      let c = std::ffi::CString::new("synth").unwrap();
      use_$N(&c);
  }
